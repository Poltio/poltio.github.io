<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>KIKO Milano Austria</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <div id="shell-top"></div>
  <main>
    <section class="hero" aria-label="Your store">
      <div class="wrap hero__inner" data-hero></div>
    </section>

    <div class="wrap"><div class="showall" data-home-showall hidden></div></div>
    <div data-rails></div>

    <section class="wrap section">
      <div class="section__head"><h2>Shop by category</h2></div>
      <div class="cat-tiles" data-cats></div>
    </section>

    <section class="wrap section" data-editorial-wrap>
      <a class="editorial" data-editorial href="plp.html">
        <div class="editorial__art" data-editorial-art></div>
        <div class="editorial__copy">
          <p class="eyebrow">Shade match</p>
          <h2>Shade match from 2,300 buyers</h2>
          <p>See which shade people with your skin tone bought, and how it matched, before you choose yours.</p>
          <span class="btn btn--accent">See it in action</span>
        </div>
      </a>
    </section>
  </main>
  <div id="shell-bottom"></div>

  <script src="data/catalog.js"></script>
  <script src="assets/js/match.js"></script>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/question.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
