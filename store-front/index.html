<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>KIKO Milano Austria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body class="home">
  <div id="shell-top"></div>
  <main>
    <section class="h-hero" aria-label="Your KIKO">
      <img class="h-hero__img" data-hero-img alt="" fetchpriority="high" src="https://images.unsplash.com/photo-1648249969490-44f3052a3721?w=2000&q=70&auto=format&fit=crop">
      <div class="h-hero__panel" data-panel aria-live="polite"></div>
    </section>

    <div class="wrap"><div class="showall" data-home-showall hidden></div></div>

    <section class="routine wrap" aria-labelledby="routine-title">
      <header class="h-head">
        <h2 id="routine-title" class="display"><span>Your</span> <b>routine</b></h2>
        <p class="h-head__sub" data-routine-sub></p>
      </header>
      <ol class="routine__steps" data-routine></ol>
    </section>

    <section class="help wrap" aria-labelledby="help-title">
      <h2 id="help-title" class="display display--center"><span>How can we</span> <b>help?</b></h2>
      <div class="help__tiles" data-help></div>
    </section>

    <section class="match" data-match aria-labelledby="match-title" hidden>
      <img class="match__img" src="https://images.unsplash.com/photo-1633329712165-4e578376eb87?w=1800&q=70&auto=format&fit=crop" alt="" loading="lazy">
      <div class="match__panel" data-match-panel></div>
    </section>
  </main>
  <div id="shell-bottom"></div>

  <script src="data/catalog.js"></script>
  <script src="assets/js/match.js"></script>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/question.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/shade-match.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
