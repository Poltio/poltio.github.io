<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Foundation · KIKO Milano Austria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/pdp.css">
</head>
<body class="pdp-page">
  <div id="shell-top"></div>
  <main class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <a href="plp.html">Foundations</a> / <span data-crumb></span></nav>
    <div class="pdp">
      <div class="pdp__gallery">
        <div class="pdp__hero" data-hero></div>
        <div class="pdp__thumbs" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <div class="pdp__info">
        <p class="eyebrow">Foundation</p>
        <h1 data-name></h1>
        <div class="pdp__meta"><span data-stars></span><span class="pdp__price" data-price></span></div>
        <p class="pdp__blurb" data-blurb></p>
        <div data-echo></div>
        <div class="shades">
          <div class="shades__head"><span>Shade: <b data-shade-name></b></span><span class="shades__note" data-shade-note></span></div>
          <div data-depth-q></div>
          <div class="shades__grid" data-shades role="radiogroup" aria-label="Shade"></div>
        </div>
        <div class="buy" data-buy>
          <div class="buy__price hide-desktop" data-buy-price></div>
          <button class="btn btn--accent buy__btn" data-add>Add to bag</button>
        </div>
      </div>
    </div>
    <div data-shade-match></div>
    <section class="pdp-sec" data-pairs-wrap>
      <div class="pdp-sec__head"><h2>Pairs well with</h2><p data-pairs-sub></p></div>
      <div class="pairs" data-pairs></div>
    </section>
    <section class="pdp-sec howto" data-howto></section>
  </main>
  <div id="shell-bottom"></div>

  <script src="data/catalog.js"></script>
  <script src="assets/js/match.js"></script>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/question.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/echo.js"></script>
  <script src="assets/js/shade-match.js"></script>
  <script src="assets/js/pdp.js"></script>
</body>
</html>
